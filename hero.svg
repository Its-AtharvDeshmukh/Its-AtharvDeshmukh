    font-weight="500"
    fill="#9FB0C3"
  >
    Full-Stack · Backend · AI Systems · HealthTech
  </text>


  <!-- ROTATING FOCUS LINE -->

  <g class="enter-3">

    <rect
      x="39"
      y="136"
      width="382"
      height="25"
      rx="12.5"
      fill="#FFFFFF"
      fill-opacity=".022"
      stroke="#FFFFFF"
      stroke-opacity=".065"
    />


    <text
      x="53"

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 250"
     width="760"
     height="250"
     role="img"
     aria-labelledby="title description">

  <title id="title">Atharv Deshmukh</title>
  <desc id="description">
    Full-stack engineer focused on backend architecture, AI integration and HealthTech.
  </desc>

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#090E17"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="0.78" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow" cx="0.1" cy="1" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".20"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>

    <linearGradient id="edgeGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <pattern id="grid"
             width="28"
             height="28"
             patternUnits="userSpaceOnUse">
      <path
        d="M28 0H0V28"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity=".035"
      />
    </pattern>

    <clipPath id="cardClip">
      <rect width="760" height="250" rx="18"/>
    </clipPath>

  </defs>

  <style>

    .mono {
      font-family:
        'JetBrains Mono',
        'SF Mono',
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        'Liberation Mono',
        monospace;
    }

    .sans {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .rise {
      animation: rise .9s cubic-bezier(.2,.7,.2,1) both;
    }

    .rise-delay {
      animation: rise .9s .15s cubic-bezier(.2,.7,.2,1) both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .focus-1,
    .focus-2,
    .focus-3 {
      animation: cycle 12s infinite;
    }

    .focus-1 {
      opacity: 1;
    }

    .focus-2,
    .focus-3 {
      opacity: 0;
    }

    .focus-2 {
      animation-delay: 4s;
    }

    .focus-3 {
      animation-delay: 8s;
    }

    @keyframes cycle {

      0% {
        opacity: 0;
        transform: translateY(6px);
      }

      3% {
        opacity: 1;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(0);
      }

      33% {
        opacity: 0;
        transform: translateY(-6px);
      }

      100% {
        opacity: 0;
      }

    }

    .flow-line {
      stroke-dasharray: 3 7;
      animation: flow 1.4s linear infinite;
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -20;
      }
    }

    .pulse {
      opacity: 0;
      transform-origin: 672px 120px;
      animation: pulse 3s ease-out infinite;
    }

    @keyframes pulse {

      0% {
        transform: scale(1);
        opacity: .55;
      }

      80%,
      100% {
        transform: scale(3.2);
        opacity: 0;
      }

    }

    .status-dot {
      animation: blink 2.4s ease-in-out infinite;
    }

    @keyframes blink {
      50% {
        opacity: .35;
      }
    }

    .scan-line {
      animation: scan 7s linear infinite;
    }

    @keyframes scan {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(1000px);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      * {
        animation: none !important;
      }

      .focus-1 {
        opacity: 1;
      }

      .focus-2,
      .focus-3 {
        display: none;
      }

    }

  </style>


  <!-- BACKGROUND -->

  <g clip-path="url(#cardClip)">

    <rect
      width="760"
      height="250"
      fill="url(#bg)"
    />

    <rect
      width="760"
      height="250"
      fill="url(#grid)"
    />

    <rect
      width="760"
      height="250"
      fill="url(#cyanGlow)"
    />

    <rect
      width="760"
      height="250"
      fill="url(#violetGlow)"
    />

    <rect
      width="760"
      height="250"
      fill="url(#glass)"
    />

    <rect
      class="scan-line"
      x="-200"
      y="0"
      width="200"
      height="2"
      fill="url(#edgeGradient)"
    />

  </g>


  <!-- GLASS BORDER -->

  <rect
    x=".5"
    y=".5"
    width="759"
    height="249"
    rx="17.5"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity=".10"
  />


  <!-- IDENTITY -->

  <text
    class="mono rise"
    x="40"
    y="54"
    font-size="13"
    fill="#67E8F9"
    letter-spacing=".4"
  >
    computer engineering · b.tech '27
  </text>

  <text
    class="sans rise-delay"
    x="40"
    y="114"
    font-size="50"
    font-weight="700"
    letter-spacing="-1"
    fill="url(#nameGradient)"
    stroke="#020617"
    stroke-width=".35"
    paint-order="stroke fill"
  >
    Atharv Deshmukh
  </text>

  <rect
    class="rise-delay"
    x="42"
    y="128"
    width="56"
    height="3"
    rx="1.5"
    fill="url(#accentBar)"
  />


  <!-- CYCLING DEVELOPMENT FOCUS -->

  <g class="focus-1">

    <text
      class="mono"
      x="40"
      y="168"
      font-size="17"
      fill="#22D3EE"
    >
      ›
    </text>

    <text
      class="mono"
      x="62"
      y="168"
      font-size="17"
      fill="#CBD5E1"
    >
      Backend architecture · REST APIs · auth
    </text>

  </g>


  <g class="focus-2">

    <text
      class="mono"
      x="40"
      y="168"
      font-size="17"
      fill="#22D3EE"
    >
      ›
    </text>

    <text
      class="mono"
      x="62"
      y="168"
      font-size="17"
      fill="#CBD5E1"
    >
      AI integration · multi-model workflows
    </text>

  </g>


  <g class="focus-3">

    <text
      class="mono"
      x="40"
      y="168"
      font-size="17"
      fill="#22D3EE"
    >
      ›
    </text>

    <text
      class="mono"
      x="62"
      y="168"
      font-size="17"
      fill="#CBD5E1"
    >
      HealthTech · product engineering
    </text>

  </g>


  <!-- CURRENT STATUS -->

  <circle
    class="status-dot"
    cx="46"
    cy="212"
    r="3.5"
    fill="#34D399"
  />

  <text
    class="mono"
    x="58"
    y="216"
    font-size="12.5"
    fill="#94A3B8"
  >
    iterating on HealthOrbit · MeshFlow
  </text>


  <!-- DAG / SYSTEM MOTIF -->

  <g
    fill="none"
    stroke="#67E8F9"
    stroke-opacity=".55"
    stroke-width="1.2"
  >

    <line
      class="flow-line"
      x1="528"
      y1="62"
      x2="606"
      y2="90"
    />

    <line
      class="flow-line"
      x1="528"
      y1="120"
      x2="606"
      y2="90"
    />

    <line
      class="flow-line"
      x1="528"
      y1="120"
      x2="606"
      y2="150"
    />

    <line
      class="flow-line"
      x1="528"
      y1="178"
      x2="606"
      y2="150"
    />

    <line
      class="flow-line"
      x1="606"
      y1="90"
      x2="672"
      y2="120"
    />

    <line
      class="flow-line"
      x1="606"
      y1="150"
      x2="672"
      y2="120"
    />

    <line
      class="flow-line"
      x1="672"
      y1="120"
      x2="726"
      y2="120"
    />

  </g>


  <!-- DAG NODES -->

  <g
    fill="#0B1220"
    stroke-width="1.6"
  >

    <circle
      cx="528"
      cy="62"
      r="4.5"
      stroke="#8B5CF6"
    />

    <circle
      cx="528"
      cy="120"
      r="4.5"
      stroke="#8B5CF6"
    />

    <circle
      cx="528"
      cy="178"
      r="4.5"
      stroke="#8B5CF6"
    />

    <circle
      cx="606"
      cy="90"
      r="5"
      stroke="#60A5FA"
    />

    <circle
      cx="606"
      cy="150"
      r="5"
      stroke="#60A5FA"
    />

    <circle
      cx="726"
      cy="120"
      r="4.5"
      stroke="#34D399"
    />

  </g>


  <!-- ACTIVE NODE -->

  <circle
    cx="672"
    cy="120"
    r="15"
    fill="#22D3EE"
    fill-opacity=".12"
  />

  <circle
    class="pulse"
    cx="672"
    cy="120"
    r="7"
    fill="none"
    stroke="#22D3EE"
    stroke-width="1.5"
  />

  <circle
    cx="672"
    cy="120"
    r="7"
    fill="#22D3EE"
  />

</svg>

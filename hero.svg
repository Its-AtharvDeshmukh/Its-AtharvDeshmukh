<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 250"
  width="760"
  height="250"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Atharv Deshmukh</title>

  <desc id="description">
    Atharv Deshmukh — Computer Engineering student and full-stack developer
    focused on backend engineering, AI systems, prompt engineering and HealthTech.
    Motto: Create. Engineer. Improve.
  </desc>

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1626"/>
      <stop offset="52%" stop-color="#08121F"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".46"/>
      <stop offset="38%" stop-color="#0891B2" stop-opacity=".20"/>
      <stop offset="68%" stop-color="#8B5CF6" stop-opacity=".52"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity=".44"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="72%" stop-color="#E6F8FC"/>
      <stop offset="100%" stop-color="#B6F3FA"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <linearGradient id="mottoBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="48%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <radialGradient id="coreBackground" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#10243A"/>
      <stop offset="70%" stop-color="#091522"/>
      <stop offset="100%" stop-color="#060D16"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="80%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow" cx="7%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenGlow" cx="100%" cy="100%" r="48%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".045"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity=".008"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="44%" stop-color="#FFFFFF" stop-opacity=".012"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".085"/>
      <stop offset="56%" stop-color="#FFFFFF" stop-opacity=".018"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path
        d="M30 0H0V30"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity=".018"
        stroke-width=".7"
      />
    </pattern>

    <clipPath id="heroClip">
      <rect x="1" y="1" width="758" height="248" rx="20"/>
    </clipPath>

    <filter id="coreShadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity=".35"
      />
    </filter>

    <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .sans {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "JetBrains Mono",
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
      }

      .enter-1 {
        animation: enter .7s cubic-bezier(.2,.7,.2,1) both;
      }

      .enter-2 {
        animation: enter .75s .08s cubic-bezier(.2,.7,.2,1) both;
      }

      .enter-3 {
        animation: enter .75s .16s cubic-bezier(.2,.7,.2,1) both;
      }

      .enter-4 {
        animation: enter .75s .24s cubic-bezier(.2,.7,.2,1) both;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .create,
      .engineer,
      .improve {
        animation: wordFocus 6s ease-in-out infinite;
      }

      .engineer {
        animation-delay: 2s;
      }

      .improve {
        animation-delay: 4s;
      }

      @keyframes wordFocus {
        0%,
        100% {
          opacity: .58;
        }

        12%,
        30% {
          opacity: 1;
        }

        42% {
          opacity: .58;
        }
      }

      .status {
        animation: statusPulse 2.4s ease-in-out infinite;
      }

      @keyframes statusPulse {
        0%,
        100% {
          opacity: .45;
        }

        50% {
          opacity: 1;
        }
      }

      .focus-1,
      .focus-2,
      .focus-3 {
        animation: focusCycle 12s infinite;
      }

      .focus-1 {
        opacity: 1;
      }

      .focus-2,
      .focus-3 {
        opacity: 0;
      }

      .focus-2 {
        animation-delay: 4s;
      }

      .focus-3 {
        animation-delay: 8s;
      }

      @keyframes focusCycle {
        0% {
          opacity: 0;
          transform: translateY(5px);
        }

        4% {
          opacity: 1;
          transform: translateY(0);
        }

        29% {
          opacity: 1;
          transform: translateY(0);
        }

        33% {
          opacity: 0;
          transform: translateY(-5px);
        }

        100% {
          opacity: 0;
        }
      }

      .identity-core {
        animation: coreFloat 5s ease-in-out infinite;
      }

      @keyframes coreFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-3px);
        }
      }

      .halo {
        transform-origin: 635px 117px;
        animation: haloRotate 18s linear infinite;
      }

      @keyframes haloRotate {
        to {
          transform: rotate(360deg);
        }
      }

      .halo-reverse {
        transform-origin: 635px 117px;
        animation: haloReverse 25s linear infinite;
      }

      @keyframes haloReverse {
        to {
          transform: rotate(-360deg);
        }
      }

      .core-glow {
        animation: coreGlow 3.4s ease-in-out infinite;
      }

      @keyframes coreGlow {
        0%,
        100% {
          opacity: .24;
        }

        50% {
          opacity: .55;
        }
      }

      .core-ring-pulse {
        transform-origin: 635px 117px;
        animation: coreRingPulse 3s ease-out infinite;
      }

      @keyframes coreRingPulse {
        0% {
          transform: scale(.88);
          opacity: .45;
        }

        75% {
          transform: scale(1.2);
          opacity: 0;
        }

        100% {
          transform: scale(1.2);
          opacity: 0;
        }
      }

      .prompt-dot {
        animation: promptPulse 2.7s ease-in-out infinite;
      }

      @keyframes promptPulse {
        0%,
        100% {
          opacity: .45;
        }

        50% {
          opacity: 1;
        }
      }

      .reflection {
        animation: reflectionSweep 8s cubic-bezier(.4,0,.2,1) infinite;
      }

      @keyframes reflectionSweep {
        0% {
          transform: translateX(-180px);
          opacity: 0;
        }

        15% {
          opacity: .65;
        }

        72% {
          opacity: .65;
        }

        86% {
          opacity: 0;
        }

        100% {
          transform: translateX(960px);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }

        .focus-1 {
          opacity: 1;
        }

        .focus-2,
        .focus-3 {
          display: none;
        }
      }
    </style>

  </defs>


  <!-- BACKGROUND -->

  <g clip-path="url(#heroClip)">

    <rect width="760" height="250" fill="url(#bg)"/>
    <rect width="760" height="250" fill="url(#grid)"/>
    <rect width="760" height="250" fill="url(#cyanGlow)"/>
    <rect width="760" height="250" fill="url(#violetGlow)"/>
    <rect width="760" height="250" fill="url(#greenGlow)"/>
    <rect width="760" height="250" fill="url(#glass)"/>

    <g class="reflection">
      <rect
        x="-120"
        y="-80"
        width="90"
        height="420"
        rx="30"
        fill="url(#reflection)"
        transform="rotate(13 -70 125)"
      />
    </g>

  </g>


  <!-- BORDER -->

  <rect
    x=".7"
    y=".7"
    width="758.6"
    height="248.6"
    rx="19.3"
    fill="none"
    stroke="url(#borderGradient)"
    stroke-width="1.3"
  />


  <!-- LEFT — IDENTITY -->

  <g class="enter-1">

    <circle
      class="status"
      cx="43"
      cy="39"
      r="3.1"
      fill="#22C55E"
    />

    <text
      x="55"
      y="43"
      class="mono"
      font-size="10"
      font-weight="700"
      letter-spacing=".65"
      fill="#7DD3FC"
    >
      COMPUTER ENGINEERING · B.TECH '27
    </text>

  </g>


  <text
    x="39"
    y="97"
    class="sans enter-2"
    font-size="47"
    font-weight="700"
    letter-spacing="-1.15"

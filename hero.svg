    </text>


    <line
      x1="91"
      y1="142"
      x2="91"
      y2="155"
      stroke="#FFFFFF"
      stroke-opacity=".08"
    />


    <g class="focus-1">

      <circle
        cx="106"
        cy="148.5"
        r="2.6"
        fill="#22D3EE"
      />

      <text
        x="116"
        y="152.5"
        class="mono"
        font-size="9.1"
        font-weight="600"
        fill="#B8C7D8"
      >
        Backend Engineering · REST APIs · Authentication
      </text>

    </g>


    <g class="focus-2">

      <circle
        cx="106"
        cy="148.5"
        r="2.6"
        fill="#A78BFA"
      />

      <text
        x="116"
        y="152.5"
        class="mono"
        font-size="9.1"
        font-weight="600"
        fill="#C4B5FD"
      >
        AI Systems · Prompt Engineering · Context
      </text>

    </g>


    <g class="focus-3">

      <circle
        cx="106"
        cy="148.5"
        r="2.6"
        fill="#22C55E"
      />

      <text
        x="116"
        y="152.5"
        class="mono"
        font-size="9.1"
        font-weight="600"
        fill="#B7E6C5"
      >
        HealthTech · Product Engineering · HealthOrbit
      </text>

    </g>

  </g>


  <!-- MOTTO -->

  <g class="enter-4">

    <rect
      x="39"
      y="174"
      width="278"
      height="34"
      rx="17"
      fill="#FFFFFF"
      fill-opacity=".022"
      stroke="url(#mottoBorder)"
      stroke-width="1"
      stroke-opacity=".30"
    />


    <text
      x="57"
      y="195.5"
      class="sans create"
      font-size="13.5"
      font-weight="700"
      fill="#67E8F9"
    >
      Create.
    </text>


    <circle
      cx="114"
      cy="190.5"
      r="1.9"
      fill="#475569"
    />


    <text
      x="126"
      y="195.5"
      class="sans engineer"
      font-size="13.5"
      font-weight="700"
      fill="#C4B5FD"
    >
      Engineer.
    </text>


    <circle
      cx="202"

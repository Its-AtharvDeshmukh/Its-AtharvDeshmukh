      r="1.9"
      fill="#475569"
    />


    <text
      x="214"
      y="195.5"
      class="sans improve"
      font-size="13.5"
      font-weight="700"
      fill="#86EFAC"
    >
      Improve.
    </text>

  </g>


  <!-- CURRENT STATUS -->

  <g class="enter-4">

    <circle
      class="status"
      cx="44"
      cy="227"
      r="3.2"
      fill="#22C55E"
    />


    <text
      x="56"
      y="231"
      class="mono"
      font-size="10.3"
      fill="#7F91A6"
    >
      building HealthOrbit
    </text>

  </g>


  <!-- RIGHT SEPARATOR -->

  <line
    x1="494"
    y1="37"
    x2="494"
    y2="213"
    stroke="#FFFFFF"
    stroke-opacity=".055"
  />


  <!-- DEVELOPER IDENTITY CORE -->

  <g class="enter-3">

    <text
      x="635"
      y="40"
      text-anchor="middle"
      class="mono"
      font-size="8"
      font-weight="700"
      letter-spacing="1.2"
      fill="#52667A"
    >
      DEVELOPER IDENTITY
    </text>


    <circle
      cx="635"
      cy="117"
      r="76"
      fill="#08131F"
      fill-opacity=".25"
      stroke="#FFFFFF"
      stroke-opacity=".025"
    />


    <!-- OUTER SEGMENTED HALO -->

    <g class="halo">

      <circle
        cx="635"
        cy="117"
        r="68"
        fill="none"
        stroke="#22D3EE"
        stroke-width="1.2"
        stroke-opacity=".20"
        stroke-dasharray="42 20 9 29"
        stroke-linecap="round"
      />


      <circle
        cx="635"
        cy="49"
        r="3"
        fill="#22D3EE"
      />

    </g>


    <!-- REVERSE HALO -->

    <g class="halo-reverse">

      <circle
        cx="635"
        cy="117"
        r="57"
        fill="none"
        stroke="#8B5CF6"
        stroke-width="1"
        stroke-opacity=".18"
        stroke-dasharray="18 15 40 26"
        stroke-linecap="round"
      />


      <circle
        cx="692"
        cy="117"
        r="2.8"
        fill="#8B5CF6"
      />

    </g>


    <!-- INNER GUIDE -->

    <circle
      cx="635"
      cy="117"
      r="46"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity=".055"
      stroke-width="1"
    />


    <!-- PULSE RING -->

    <circle
      class="core-ring-pulse"
      cx="635"
      cy="117"
      r="38"
      fill="none"
      stroke="#22D3EE"
      stroke-opacity=".38"
      stroke-width="1"
    />


    <!-- CORE GLOW -->

    <circle
      class="core-glow"
      cx="635"
      cy="117"
      r="38"
      fill="#22D3EE"
      fill-opacity=".08"
      filter="url(#softGlow)"
    />


    <!-- CIRCULAR AD CORE -->

    <g
      class="identity-core"
      filter="url(#coreShadow)"
    >

      <circle
        cx="635"
        cy="117"
        r="35"
        fill="url(#coreBackground)"
        stroke="url(#accentGradient)"
        stroke-width="1.3"
        stroke-opacity=".72"
      />


      <path
        d="M614 91
           A35 35 0 0 1 656 91"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity=".12"
        stroke-width="1.2"
        stroke-linecap="round"
      />


      <text
        x="635"
        y="124"
        text-anchor="middle"
        class="sans"
        font-size="22"
        font-weight="720"
        letter-spacing=".6"
        fill="url(#nameGradient)"
      >
        AD
      </text>


      <rect
        x="624"
        y="133"
        width="22"
        height="2"
        rx="1"
        fill="url(#accentGradient)"
      />

    </g>


    <!-- PROMPT ENGINEERING TAG -->

    <rect
      x="571"
      y="190"
      width="128"
      height="26"
      rx="13"
      fill="#8B5CF6"
      fill-opacity=".065"

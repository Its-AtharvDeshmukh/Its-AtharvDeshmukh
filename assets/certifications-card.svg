<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 230"
     width="420"
     height="230"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Certifications and Learning</title>
  <desc id="desc">
    Full-Stack MERN, Data Structures and Algorithms in Java,
    and Hackathon 2026 participation.
  </desc>

  <defs>

    <linearGradient id="bgCert"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="52%" stop-color="#0A1627"/>
      <stop offset="100%" stop-color="#060B13"/>
    </linearGradient>

    <linearGradient id="borderCert"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="52%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <linearGradient id="labelCert"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <radialGradient id="violetGlowCert"
                    cx="88%"
                    cy="12%"
                    r="72%">
      <stop offset="0%"
            stop-color="#8B5CF6"
            stop-opacity=".20"/>
      <stop offset="100%"
            stop-color="#8B5CF6"
            stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenGlowCert"
                    cx="10%"
                    cy="88%"
                    r="74%">
      <stop offset="0%"
            stop-color="#22C55E"
            stop-opacity=".14"/>
      <stop offset="100%"
            stop-color="#22C55E"
            stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="reflectionCert"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%"
            stop-color="#FFFFFF"
            stop-opacity="0"/>

      <stop offset="36%"
            stop-color="#FFFFFF"
            stop-opacity=".03"/>

      <stop offset="50%"
            stop-color="#FFFFFF"
            stop-opacity=".20"/>

      <stop offset="64%"
            stop-color="#FFFFFF"
            stop-opacity=".05"/>

      <stop offset="100%"
            stop-color="#FFFFFF"
            stop-opacity="0"/>

    </linearGradient>

    <clipPath id="certClip">
      <rect
        x="10"
        y="10"
        width="400"
        height="210"
        rx="24"
      />
    </clipPath>

    <filter id="shadowCert"
            x="-20%"
            y="-20%"
            width="140%"
            height="150%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="11"
        flood-color="#000000"
        flood-opacity=".32"
      />
    </filter>

    <filter id="blurCert"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

  </defs>


  <!-- CARD -->

  <rect
    x="10"
    y="10"
    width="400"
    height="210"
    rx="24"
    fill="url(#bgCert)"
    stroke="url(#borderCert)"
    stroke-width="1.4"
    stroke-opacity=".68"
    filter="url(#shadowCert)"
  />

  <rect
    x="10"
    y="10"
    width="400"
    height="210"
    rx="24"
    fill="url(#violetGlowCert)"
  />

  <rect
    x="10"
    y="10"
    width="400"
    height="210"
    rx="24"
    fill="url(#greenGlowCert)"
  />


  <!-- DECORATIVE GLOWS -->

  <g clip-path="url(#certClip)">

    <circle
      cx="365"
      cy="42"
      r="58"
      fill="#8B5CF6"
      fill-opacity=".12"
      filter="url(#blurCert)"
    />

    <circle
      cx="52"
      cy="205"
      r="65"
      fill="#22C55E"
      fill-opacity=".09"
      filter="url(#blurCert)"
    />

  </g>


  <!-- MOVING REFLECTION -->

  <g clip-path="url(#certClip)">

    <rect
      x="-150"
      y="-35"
      width="92"
      height="310"
      rx="24"
      fill="url(#reflectionCert)"
      transform="rotate(15 0 0)"
      opacity=".92">

      <animate
        attributeName="x"
        values="-170;500"
        dur="5.6s"
        repeatCount="indefinite"
      />

    </rect>

  </g>


  <!-- LABEL -->

  <rect
    x="28"
    y="28"
    width="132"
    height="26"
    rx="13"
    fill="url(#labelCert)"
  />

  <text
    x="94"
    y="45"
    text-anchor="middle"
    font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="10.5"
    font-weight="700"
    letter-spacing=".9"
    fill="#FFFFFF">
    CERTIFICATIONS
  </text>


  <!-- VERIFIED ICON -->

  <circle
    cx="377"
    cy="41"
    r="13"
    fill="#8B5CF6"
    fill-opacity=".12"
    stroke="#C084FC"
    stroke-opacity=".55"
  />

  <path
    d="M371.5 41.3l3.5 3.5 7-8"
    fill="none"
    stroke="#E9D5FF"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />


  <!-- TITLE -->

  <text
    x="28"
    y="86"
    font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="23"
    font-weight="700"
    fill="#F8FAFC">
    Technical Learning
  </text>

  <text
    x="28"
    y="108"
    font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="12.5"
    font-weight="500"
    fill="#CBD5E1">
    Certifications and completed learning milestones
  </text>


  <!-- ITEM 1 -->

  <circle
    cx="32"
    cy="137"
    r="4"
    fill="#22C55E">

    <animate
      attributeName="opacity"
      values=".55;1;.55"
      dur="2.8s"
      repeatCount="indefinite"
    />

  </circle>

  <text
    x="45"
    y="141"
    font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="12.1"
    fill="#DCE7F5">
    Sigma 7 — Full-Stack Web Development (MERN)
  </text>


  <!-- ITEM 2 -->

  <circle
    cx="32"
    cy="165"
    r="4"
    fill="#22D3EE">

    <animate
      attributeName="opacity"
      values=".55;1;.55"
      dur="2.8s"
      begin=".35s"
      repeatCount="indefinite"
    />

  </circle>

  <text
    x="45"
    y="169"
    font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="12.1"
    fill="#DCE7F5">
    Data Structures &amp; Algorithms in Java
  </text>


  <!-- ITEM 3 -->

  <circle
    cx="32"
    cy="193"
    r="4"
    fill="#C084FC">

    <animate
      attributeName="opacity"
      values=".55;1;.55"
      dur="2.8s"
      begin=".7s"
      repeatCount="indefinite"
    />

  </circle>

  <text
    x="45"
    y="197"
    font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="12.1"
    fill="#DCE7F5">
    Hackathon 2026 — Certificate of Participation
  </text>

</svg>

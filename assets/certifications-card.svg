<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-labelledby="title desc">
  <title id="title">Certifications and Learning</title>
  <desc id="desc">Learning milestones including MERN, DSA in Java, and hackathon participation.</desc>

  <defs>
    <linearGradient id="bgCert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0a1627"/>
      <stop offset="100%" stop-color="#08101c"/>
    </linearGradient>

    <linearGradient id="strokeCert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="tagCert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <radialGradient id="glowCert1" cx="82%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCert2" cx="12%" cy="86%" r="70%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowCert" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <filter id="blurCert">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <style>
      .title {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 24px;
        font-weight: 700;
        fill: #f8fafc;
      }
      .subtitle {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #cbd5e1;
      }
      .body {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 12.5px;
        fill: #dbe7f5;
      }
      .small {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 11.5px;
        fill: #94a3b8;
      }
      .tag {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: 0.8px;
      }
      .item {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 12.4px;
        fill: #dbe7f5;
      }
      .shine {
        animation: shineMove 5s linear infinite;
      }
      .dot1, .dot2, .dot3 {
        animation: pulseDot 2.8s ease-in-out infinite;
      }
      .dot2 { animation-delay: 0.3s; }
      .dot3 { animation-delay: 0.6s; }
      @keyframes shineMove {
        0% { transform: translateX(-120px) skewX(-18deg); opacity: 0; }
        20% { opacity: 0.08; }
        80% { opacity: 0.08; }
        100% { transform: translateX(480px) skewX(-18deg); opacity: 0; }
      }
      @keyframes pulseDot {
        0%,100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .shine, .dot1, .dot2, .dot3 { animation: none; }
      }
    </style>
  </defs>

  <rect x="12" y="12" width="376" height="196" rx="24" fill="url(#bgCert)" stroke="url(#strokeCert)" stroke-opacity="0.55" stroke-width="1.4" filter="url(#shadowCert)"/>
  <rect x="12" y="12" width="376" height="196" rx="24" fill="url(#glowCert1)"/>
  <rect x="12" y="12" width="376" height="196" rx="24" fill="url(#glowCert2)"/>

  <ellipse cx="318" cy="48" rx="74" ry="44" fill="#8b5cf6" fill-opacity="0.16" filter="url(#blurCert)"/>
  <ellipse cx="86" cy="176" rx="82" ry="46" fill="#22c55e" fill-opacity="0.12" filter="url(#blurCert)"/>

  <rect x="28" y="28" width="158" height="24" rx="12" fill="url(#tagCert)"/>
  <text x="107" y="44" text-anchor="middle" class="tag">CERTIFICATES</text>

  <circle cx="350" cy="40" r="11" fill="#8b5cf6" fill-opacity="0.16" stroke="#c084fc" stroke-opacity="0.6"/>
  <path d="M345 40.5l3 3 6-7" fill="none" stroke="#e9d5ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="28" y="82" class="title">Learning &amp; Achievements</text>
  <text x="28" y="104" class="subtitle">Core certifications and technical growth</text>

  <circle class="dot1" cx="32" cy="132" r="4" fill="#22c55e"/>
  <text x="45" y="136" class="item">Sigma 7 — Full-Stack Web Development (MERN)</text>

  <circle class="dot2" cx="32" cy="156" r="4" fill="#22d3ee"/>
  <text x="45" y="160" class="item">Data Structures &amp; Algorithms in Java</text>

  <circle class="dot3" cx="32" cy="180" r="4" fill="#c084fc"/>
  <text x="45" y="184" class="item">Hackathon 2026 — Certificate of Participation</text>

  <rect class="shine" x="-120" y="12" width="70" height="196" rx="20" fill="#ffffff"/>
</svg>

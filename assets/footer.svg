<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 92"
  width="760"
  height="92"
  role="img"
  aria-labelledby="title description"
>

  <title id="title">Atharv Deshmukh — Developer Footer</title>

  <desc id="description">
    Build with purpose. Improve with every version.
    Full-stack engineering, AI systems, prompt engineering and HealthTech.
  </desc>


  <!-- ====================================================== -->
  <!-- DEFINITIONS                                            -->
  <!-- ====================================================== -->

  <defs>

    <!-- BACKGROUND -->

    <linearGradient
      id="footerBackground"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="52%" stop-color="#0A1627"/>
      <stop offset="100%" stop-color="#060B13"/>
    </linearGradient>


    <!-- BORDER -->

    <linearGradient
      id="footerBorder"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#22D3EE"
        stop-opacity=".15"
      />

      <stop
        offset="26%"
        stop-color="#22D3EE"
        stop-opacity=".80"
      />

      <stop
        offset="55%"
        stop-color="#8B5CF6"
        stop-opacity=".85"
      />

      <stop
        offset="78%"
        stop-color="#22C55E"
        stop-opacity=".65"
      />

      <stop
        offset="100%"
        stop-color="#22C55E"
        stop-opacity=".12"
      />
    </linearGradient>


    <!-- MOTTO TEXT -->

    <linearGradient
      id="mottoGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="48%" stop-color="#CFFAFE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>


    <!-- CYAN GLOW -->

    <radialGradient
      id="footerCyanGlow"
      cx="15%"
      cy="100%"
      r="72%"
    >
      <stop
        offset="0%"
        stop-color="#22D3EE"
        stop-opacity=".14"
      />

      <stop
        offset="100%"
        stop-color="#22D3EE"
        stop-opacity="0"
      />
    </radialGradient>


    <!-- VIOLET GLOW -->

    <radialGradient
      id="footerVioletGlow"
      cx="88%"
      cy="0%"
      r="72%"
    >
      <stop
        offset="0%"
        stop-color="#8B5CF6"
        stop-opacity=".15"
      />

      <stop
        offset="100%"
        stop-color="#8B5CF6"
        stop-opacity="0"
      />
    </radialGradient>


    <!-- REFLECTION -->

    <linearGradient
      id="footerReflection"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >

      <stop
        offset="0%"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />

      <stop
        offset="40%"
        stop-color="#FFFFFF"
        stop-opacity=".02"
      />

      <stop
        offset="50%"
        stop-color="#FFFFFF"
        stop-opacity=".14"
      />

      <stop
        offset="60%"
        stop-color="#FFFFFF"
        stop-opacity=".03"
      />

      <stop
        offset="100%"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />

    </linearGradient>


    <!-- CLIPPING -->

    <clipPath id="footerClip">

      <rect
        x="10"
        y="10"
        width="740"
        height="72"
        rx="21"
      />

    </clipPath>


    <!-- SHADOW -->

    <filter
      id="footerShadow"
      x="-20%"
      y="-40%"
      width="140%"
      height="180%"
    >

      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity=".27"
      />

    </filter>


    <!-- SOFT TEXT GLOW -->

    <filter
      id="mottoGlow"
      x="-20%"
      y="-80%"
      width="140%"
      height="260%"
    >

      <feGaussianBlur
        stdDeviation="2.8"
        result="blur"
      />

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>

  </defs>


  <!-- ====================================================== -->
  <!-- ANIMATION                                              -->
  <!-- ====================================================== -->

  <style>

    .sans {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }


    .mono {
      font-family:
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
    }


    .reflectionMove {
      animation:
        footerSweep
        7s
        cubic-bezier(.4,0,.2,1)
        infinite;
    }


    @keyframes footerSweep {

      0% {
        transform: translateX(-180px);
        opacity: 0;
      }

      14% {
        opacity: .85;
      }

      70% {
        opacity: .85;
      }

      86% {
        opacity: 0;
      }

      100% {
        transform: translateX(1080px);
        opacity: 0;
      }

    }


    .dividerFlow {
      stroke-dasharray: 4 8;
      animation:
        dividerMotion
        2.4s
        linear
        infinite;
    }


    @keyframes dividerMotion {

      to {
        stroke-dashoffset: -24;
      }

    }


    .dotPulse {
      animation:
        dotPulse
        2.4s
        ease-in-out
        infinite;
    }


    @keyframes dotPulse {

      0%,
      100% {
        opacity: .45;
      }

      50% {
        opacity: 1;
      }

    }


    @media (prefers-reduced-motion: reduce) {

      .reflectionMove,
      .dividerFlow,
      .dotPulse {
        animation: none !important;
      }

    }

  </style>


  <!-- ====================================================== -->
  <!-- CARD                                                   -->
  <!-- ====================================================== -->

  <rect
    x="10"
    y="10"
    width="740"
    height="72"
    rx="21"
    fill="url(#footerBackground)"
    stroke="url(#footerBorder)"
    stroke-width="1.25"
    filter="url(#footerShadow)"
  />


  <rect
    x="10"
    y="10"
    width="740"
    height="72"
    rx="21"
    fill="url(#footerCyanGlow)"
  />


  <rect
    x="10"
    y="10"
    width="740"
    height="72"
    rx="21"
    fill="url(#footerVioletGlow)"
  />


  <!-- ====================================================== -->
  <!-- REFLECTION                                             -->
  <!-- ====================================================== -->

  <g clip-path="url(#footerClip)">

    <g class="reflectionMove">

      <g transform="rotate(15 -80 45)">

        <rect
          x="-105"
          y="-80"
          width="100"
          height="260"
          rx="30"
          fill="url(#footerReflection)"
        />

      </g>

    </g>

  </g>


  <!-- ====================================================== -->
  <!-- MOTTO                                                  -->
  <!-- ====================================================== -->

  <text
    x="380"
    y="39"
    text-anchor="middle"
    class="sans"
    font-size="16"
    font-weight="650"
    letter-spacing=".05"
    fill="url(#mottoGradient)"
    filter="url(#mottoGlow)"
  >
    Build with purpose. Improve with every version.
  </text>


  <!-- ====================================================== -->
  <!-- SMALL DIVIDER                                          -->
  <!-- ====================================================== -->

  <line
    class="dividerFlow"
    x1="194"
    y1="52"
    x2="566"
    y2="52"
    stroke="#22D3EE"
    stroke-width="1"
    stroke-opacity=".35"
  />


  <!-- ====================================================== -->
  <!-- AREAS                                                  -->
  <!-- ====================================================== -->

  <circle
    class="dotPulse"
    cx="230"
    cy="66"
    r="2.5"
    fill="#22D3EE"
  />

  <text
    x="241"
    y="69"
    class="mono"
    font-size="8.6"
    fill="#94A3B8"
  >
    FULL-STACK
  </text>


  <circle
    class="dotPulse"
    cx="322"
    cy="66"
    r="2.5"
    fill="#8B5CF6"
  />

  <text
    x="333"
    y="69"
    class="mono"
    font-size="8.6"
    fill="#94A3B8"
  >
    AI SYSTEMS
  </text>


  <circle
    class="dotPulse"
    cx="421"
    cy="66"
    r="2.5"
    fill="#60A5FA"
  />

  <text
    x="432"
    y="69"
    class="mono"
    font-size="8.6"
    fill="#94A3B8"
  >
    PROMPT ENGINEERING
  </text>


  <circle
    class="dotPulse"
    cx="553"
    cy="66"
    r="2.5"
    fill="#22C55E"
  />

  <text
    x="564"
    y="69"
    class="mono"
    font-size="8.6"
    fill="#94A3B8"
  >
    HEALTHTECH
  </text>

</svg>

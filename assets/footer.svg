<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 112"
  width="760"
  height="112"
  role="img"
  aria-labelledby="title description"
>

  <title id="title">Atharv Deshmukh — Developer Footer</title>

  <desc id="description">
    Build with purpose. Improve with every version.
    Full-stack engineering, AI systems, prompt engineering and HealthTech.
  </desc>


  <defs>

    <!-- ================================================== -->
    <!-- BACKGROUND                                         -->
    <!-- ================================================== -->

    <linearGradient
      id="footerBackground"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="52%" stop-color="#0A1627"/>
      <stop offset="100%" stop-color="#060B13"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- BORDER                                             -->
    <!-- ================================================== -->

    <linearGradient
      id="footerBorder"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".58"/>
      <stop offset="34%" stop-color="#0891B2" stop-opacity=".72"/>
      <stop offset="65%" stop-color="#8B5CF6" stop-opacity=".78"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity=".58"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- MOTTO                                              -->
    <!-- ================================================== -->

    <linearGradient
      id="mottoGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="48%" stop-color="#CFFAFE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- BOTTOM ACCENT                                      -->
    <!-- ================================================== -->

    <linearGradient
      id="bottomAccent"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="18%" stop-color="#22D3EE"/>
      <stop offset="48%" stop-color="#8B5CF6"/>
      <stop offset="78%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- GLOWS                                              -->
    <!-- ================================================== -->

    <radialGradient
      id="cyanGlow"
      cx="10%"
      cy="100%"
      r="75%"
    >
      <stop
        offset="0%"
        stop-color="#22D3EE"
        stop-opacity=".12"
      />

      <stop
        offset="100%"
        stop-color="#22D3EE"
        stop-opacity="0"
      />
    </radialGradient>


    <radialGradient
      id="violetGlow"
      cx="90%"
      cy="0%"
      r="75%"
    >
      <stop
        offset="0%"
        stop-color="#8B5CF6"
        stop-opacity=".13"
      />

      <stop
        offset="100%"
        stop-color="#8B5CF6"
        stop-opacity="0"
      />
    </radialGradient>


    <!-- ================================================== -->
    <!-- REFLECTION                                         -->
    <!-- ================================================== -->

    <linearGradient
      id="reflection"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />

      <stop
        offset="40%"
        stop-color="#FFFFFF"
        stop-opacity=".018"
      />

      <stop
        offset="50%"
        stop-color="#FFFFFF"
        stop-opacity=".13"
      />

      <stop
        offset="60%"
        stop-color="#FFFFFF"
        stop-opacity=".025"
      />

      <stop
        offset="100%"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />
    </linearGradient>


    <!-- ================================================== -->
    <!-- CLIPPING                                           -->
    <!-- ================================================== -->

    <clipPath id="footerClip">
      <rect
        x="10"
        y="8"
        width="740"
        height="96"
        rx="22"
      />
    </clipPath>


    <!-- ================================================== -->
    <!-- ANIMATION                                          -->
    <!-- ================================================== -->

    <style>

      .sans {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "JetBrains Mono",
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
      }


      .reflection {
        animation:
          reflectionSweep
          7.5s
          cubic-bezier(.4,0,.2,1)
          infinite;
      }

      @keyframes reflectionSweep {

        0% {
          transform: translateX(-180px);
          opacity: 0;
        }

        12% {
          opacity: .90;
        }

        72% {
          opacity: .90;
        }

        86% {
          opacity: 0;
        }

        100% {
          transform: translateX(1050px);
          opacity: 0;
        }

      }


      .accent-pulse {
        animation:
          accentPulse
          4s
          ease-in-out
          infinite;
      }

      @keyframes accentPulse {

        0%,
        100% {
          opacity: .55;
        }

        50% {
          opacity: 1;
        }

      }


      @media (prefers-reduced-motion: reduce) {

        .reflection,
        .accent-pulse {
          animation: none !important;
        }

      }

    </style>

  </defs>


  <!-- ====================================================== -->
  <!-- MAIN CARD                                              -->
  <!-- ====================================================== -->

  <rect
    x="10"
    y="8"
    width="740"
    height="96"
    rx="22"
    fill="url(#footerBackground)"
    stroke="url(#footerBorder)"
    stroke-width="1.3"
  />


  <!-- BACKGROUND GLOWS -->

  <rect
    x="10"
    y="8"
    width="740"
    height="96"
    rx="22"
    fill="url(#cyanGlow)"
  />


  <rect
    x="10"
    y="8"
    width="740"
    height="96"
    rx="22"
    fill="url(#violetGlow)"
  />


  <!-- ====================================================== -->
  <!-- REFLECTION                                             -->
  <!-- ====================================================== -->

  <g clip-path="url(#footerClip)">

    <g class="reflection">

      <g transform="rotate(14 -60 55)">

        <rect
          x="-115"
          y="-90"
          width="95"
          height="290"
          rx="28"
          fill="url(#reflection)"
        />

      </g>

    </g>

  </g>


  <!-- ====================================================== -->
  <!-- MOTTO                                                  -->
  <!-- ====================================================== -->

  <text
    x="380"
    y="35"
    text-anchor="middle"
    class="sans"
    font-size="15.5"
    font-weight="650"
    fill="url(#mottoGradient)"
  >
    Build with purpose. Improve with every version.
  </text>


  <!-- ====================================================== -->
  <!-- DIVIDER                                                -->
  <!-- ====================================================== -->

  <line
    x1="86"
    y1="49"
    x2="674"
    y2="49"
    stroke="#FFFFFF"
    stroke-opacity=".07"
  />


  <!-- ====================================================== -->
  <!-- EXACT FOUR-COLUMN GRID                                 -->
  <!-- ====================================================== -->


  <!-- COLUMN 1 -->

  <rect
    x="54"
    y="60"
    width="154"
    height="26"
    rx="13"
    fill="#22D3EE"
    fill-opacity=".065"
    stroke="#22D3EE"
    stroke-opacity=".20"
  />


  <text
    x="131"
    y="77"
    text-anchor="middle"
    class="mono"
    font-size="9.5"
    font-weight="700"
    fill="#67E8F9"
  >
    FULL-STACK
  </text>


  <!-- COLUMN 2 -->

  <rect
    x="220"
    y="60"
    width="154"
    height="26"
    rx="13"
    fill="#3B82F6"
    fill-opacity=".065"
    stroke="#3B82F6"
    stroke-opacity=".20"
  />


  <text
    x="297"
    y="77"
    text-anchor="middle"
    class="mono"
    font-size="9.5"
    font-weight="700"
    fill="#93C5FD"
  >
    AI SYSTEMS
  </text>


  <!-- COLUMN 3 -->

  <rect
    x="386"
    y="60"
    width="154"
    height="26"
    rx="13"
    fill="#8B5CF6"
    fill-opacity=".075"
    stroke="#8B5CF6"
    stroke-opacity=".22"
  />


  <text
    x="463"
    y="77"
    text-anchor="middle"
    class="mono"
    font-size="8.3"
    font-weight="700"
    fill="#C4B5FD"
  >
    PROMPT ENGINEERING
  </text>


  <!-- COLUMN 4 -->

  <rect
    x="552"
    y="60"
    width="154"
    height="26"
    rx="13"
    fill="#22C55E"
    fill-opacity=".065"
    stroke="#22C55E"
    stroke-opacity=".20"
  />


  <text
    x="629"
    y="77"
    text-anchor="middle"
    class="mono"
    font-size="9.5"
    font-weight="700"
    fill="#86EFAC"
  >
    HEALTHTECH
  </text>


  <!-- ====================================================== -->
  <!-- BOTTOM ACCENT                                          -->
  <!-- ====================================================== -->

  <rect
    class="accent-pulse"
    x="144"
    y="94"
    width="472"
    height="1.8"
    rx=".9"
    fill="url(#bottomAccent)"
  />

</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 230"
     width="420"
     height="230"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Oasis Infobyte Internship</title>
  <desc id="desc">
    Web Development and Designing Internship with practical frontend project work.
  </desc>

  <defs>

    <linearGradient id="bgIntern"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="52%" stop-color="#0A1627"/>
      <stop offset="100%" stop-color="#060B13"/>
    </linearGradient>

    <linearGradient id="borderIntern"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="52%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="labelIntern"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <radialGradient id="blueGlowIntern"
                    cx="88%"
                    cy="12%"
                    r="72%">
      <stop offset="0%"
            stop-color="#38BDF8"
            stop-opacity=".19"/>
      <stop offset="100%"
            stop-color="#38BDF8"
            stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlowIntern"
                    cx="10%"
                    cy="88%"
                    r="74%">
      <stop offset="0%"
            stop-color="#22D3EE"
            stop-opacity=".14"/>
      <stop offset="100%"
            stop-color="#22D3EE"
            stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="reflectionIntern"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%"
            stop-color="#FFFFFF"
            stop-opacity="0"/>

      <stop offset="36%"
            stop-color="#FFFFFF"
            stop-opacity=".03"/>

      <stop offset="50%"
            stop-color="#FFFFFF"
            stop-opacity=".19"/>

      <stop offset="64%"
            stop-color="#FFFFFF"
            stop-opacity=".05"/>

      <stop offset="100%"
            stop-color="#FFFFFF"
            stop-opacity="0"/>

    </linearGradient>

    <clipPath id="internClip">
      <rect
        x="10"
        y="10"
        width="400"
        height="210"
        rx="24"
      />
    </clipPath>

    <filter id="shadowIntern"
            x="-20%"
            y="-20%"
            width="140%"
            height="150%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="11"
        flood-color="#000000"
        flood-opacity=".32"
      />
    </filter>

    <filter id="blurIntern"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

  </defs>


  <!-- CARD -->

  <rect
    x="10"
    y="10"
    width="400"
    height="210"
    rx="24"
    fill="url(#bgIntern)"
    stroke="url(#borderIntern)"
    stroke-width="1.4"
    stroke-opacity=".68"
    filter="url(#shadowIntern)"
  />

  <rect
    x="10"
    y="10"
    width="400"
    height="210"
    rx="24"
    fill="url(#blueGlowIntern)"
  />

  <rect
    x="10"
    y="10"
    width="400"
    height="210"
    rx="24"
    fill="url(#cyanGlowIntern)"
  />


  <!-- BACKGROUND GLOW -->

  <g clip-path="url(#internClip)">

    <circle
      cx="365"
      cy="42"
      r="58"
      fill="#38BDF8"
      fill-opacity=".11"
      filter="url(#blurIntern)"
    />

    <circle
      cx="55"
      cy="205"
      r="66"
      fill="#06B6D4"
      fill-opacity=".09"
      filter="url(#blurIntern)"
    />

  </g>


  <!-- MOVING REFLECTION -->

  <g clip-path="url(#internClip)">

    <rect
      x="-150"
      y="-35"
      width="92"
      height="310"
      rx="24"
      fill="url(#reflectionIntern)"
      transform="rotate(15 0 0)"
      opacity=".92">

      <animate
        attributeName="x"
        values="-170;500"
        dur="5.2s"
        repeatCount="indefinite"
      />

    </rect>

  </g>


  <!-- LABEL -->

  <rect
    x="28"
    y="28"
    width="114"
    height="26"
    rx="13"
    fill="url(#labelIntern)"
  />

  <text
    x="85"
    y="45"
    text-anchor="middle"
    font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="10.5"
    font-weight="700"
    letter-spacing=".9"
    fill="#FFFFFF">
    INTERNSHIP
  </text>


  <!-- CODE ICON -->

  <rect
    x="351"
    y="28"
    width="30"
    height="26"
    rx="8"
    fill="#38BDF8"
    fill-opacity=".10"
    stroke="#38BDF8"
    stroke-opacity=".55"
  />

  <path
    d="M361 36l-4 5 4 5M371 36l4 5-4 5"
    fill="none"
    stroke="#BAE6FD"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />


  <!-- TITLE -->

  <text
    x="28"
    y="87"
    font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="23"
    font-weight="700"
    fill="#F8FAFC">
    Oasis Infobyte
  </text>

  <text
    x="28"
    y="109"
    font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="12.5"
    font-weight="500"
    fill="#CBD5E1">
    Web Development &amp; Designing Internship
  </text>


  <!-- WORK -->

  <text
    x="28"
    y="139"
    font-family="JetBrains Mono,Consolas,monospace"
    font-size="10"
    font-weight="700"
    letter-spacing=".7"
    fill="#7DD3FC">
    PRACTICAL WORK
  </text>

  <text
    x="28"
    y="161"
    font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="12"
    fill="#DCE7F5">
    Responsive web pages · JavaScript projects · UI development
  </text>


  <!-- BOTTOM PROCESS -->

  <rect
    x="28"
    y="181"
    width="237"
    height="26"
    rx="13"
    fill="#38BDF8"
    fill-opacity=".07"
    stroke="#38BDF8"
    stroke-opacity=".26"
  />

  <text
    x="43"
    y="198"
    font-family="JetBrains Mono,Consolas,monospace"
    font-size="10.2"
    fill="#BAE6FD">
    build → test → improve → submit
  </text>

  <rect
    x="247"
    y="188"
    width="7"
    height="12"
    rx="1"
    fill="#67E8F9">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1.1s"
      repeatCount="indefinite"
    />

  </rect>

</svg>

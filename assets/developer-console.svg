<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 250"
  width="760"
  height="250"
  role="img"
  aria-labelledby="title description"
>

  <title id="title">Atharv Deshmukh — Developer Console</title>

  <desc id="description">
    Current development focus across HealthOrbit, MeshFlow,
    backend engineering, prompt engineering, DSA, and system design.
  </desc>


  <defs>

    <!-- ================= BACKGROUND ================= -->

    <linearGradient id="consoleBackground"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%"
            stop-color="#07111F"/>

      <stop offset="52%"
            stop-color="#0A1627"/>

      <stop offset="100%"
            stop-color="#060B13"/>

    </linearGradient>


    <!-- ================= BORDER ================= -->

    <linearGradient id="consoleBorder"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%"
            stop-color="#22D3EE"/>

      <stop offset="48%"
            stop-color="#7C3AED"/>

      <stop offset="78%"
            stop-color="#0891B2"/>

      <stop offset="100%"
            stop-color="#22C55E"/>

    </linearGradient>


    <!-- ================= TOP GLOWS ================= -->

    <radialGradient id="cyanGlow"
                    cx="82%"
                    cy="8%"
                    r="60%">

      <stop offset="0%"
            stop-color="#22D3EE"
            stop-opacity=".18"/>

      <stop offset="100%"
            stop-color="#22D3EE"
            stop-opacity="0"/>

    </radialGradient>


    <radialGradient id="violetGlow"
                    cx="6%"
                    cy="100%"
                    r="62%">

      <stop offset="0%"
            stop-color="#8B5CF6"
            stop-opacity=".17"/>

      <stop offset="100%"
            stop-color="#8B5CF6"
            stop-opacity="0"/>

    </radialGradient>


    <!-- ================= REFLECTION ================= -->

    <linearGradient id="reflection"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%"
            stop-color="#FFFFFF"
            stop-opacity="0"/>

      <stop offset="38%"
            stop-color="#FFFFFF"
            stop-opacity=".025"/>

      <stop offset="50%"
            stop-color="#FFFFFF"
            stop-opacity=".15"/>

      <stop offset="62%"
            stop-color="#FFFFFF"
            stop-opacity=".035"/>

      <stop offset="100%"
            stop-color="#FFFFFF"
            stop-opacity="0"/>

    </linearGradient>


    <!-- ================= CARD CLIP ================= -->

    <clipPath id="consoleClip">

      <rect
        x="12"
        y="12"
        width="736"
        height="226"
        rx="24"
      />

    </clipPath>


    <!-- ================= SHADOW ================= -->

    <filter id="consoleShadow"
            x="-20%"
            y="-25%"
            width="140%"
            height="160%">

      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="13"
        flood-color="#000000"
        flood-opacity=".34"
      />

    </filter>


    <!-- ================= SOFT BLUR ================= -->

    <filter id="consoleBlur"
            x="-40%"
            y="-40%"
            width="180%"
            height="180%">

      <feGaussianBlur stdDeviation="24"/>

    </filter>


    <!-- ================= TEXT STYLES ================= -->

    <style>

      .sans {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "JetBrains Mono",
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
      }


      /* ACTIVE DOT */

      .active-dot {
        animation: activePulse 2.4s ease-in-out infinite;
      }

      @keyframes activePulse {

        0%, 100% {
          opacity: .55;
        }

        50% {
          opacity: 1;
        }

      }


      /* MOVING FLOW DOT */

      .flow-dot {
        animation: flowPulse 2.8s ease-in-out infinite;
      }

      @keyframes flowPulse {

        0%, 100% {
          opacity: .45;
        }

        50% {
          opacity: 1;
        }

      }


      /* WORKFLOW ARROW */

      .arrow {
        animation: arrowPulse 2.5s ease-in-out infinite;
      }

      @keyframes arrowPulse {

        0%, 100% {
          opacity: .35;
        }

        50% {
          opacity: .85;
        }

      }


      @media (prefers-reduced-motion: reduce) {

        * {
          animation: none !important;
        }

      }

    </style>

  </defs>


  <!-- ====================================================== -->
  <!-- CARD BASE                                              -->
  <!-- ====================================================== -->

  <rect
    x="12"
    y="12"
    width="736"
    height="226"
    rx="24"
    fill="url(#consoleBackground)"
    stroke="url(#consoleBorder)"
    stroke-width="1.4"
    stroke-opacity=".68"
    filter="url(#consoleShadow)"
  />


  <!-- BACKGROUND GLOW -->

  <rect
    x="12"
    y="12"
    width="736"
    height="226"
    rx="24"
    fill="url(#cyanGlow)"
  />

  <rect
    x="12"
    y="12"
    width="736"
    height="226"
    rx="24"
    fill="url(#violetGlow)"
  />


  <!-- DECORATIVE GLOWS -->

  <g clip-path="url(#consoleClip)">

    <circle
      cx="685"
      cy="28"
      r="80"
      fill="#22D3EE"
      fill-opacity=".09"
      filter="url(#consoleBlur)"
    />

    <circle
      cx="45"
      cy="225"
      r="90"
      fill="#7C3AED"
      fill-opacity=".09"
      filter="url(#consoleBlur)"
    />

  </g>


  <!-- ====================================================== -->
  <!-- MOVING GLASS REFLECTION                                -->
  <!-- ====================================================== -->

  <g clip-path="url(#consoleClip)">

    <rect
      x="-150"
      y="12"
      width="110"
      height="226"
      fill="url(#reflection)"
    >

      <animate
        attributeName="x"
        values="-150;800"
        dur="6.5s"
        repeatCount="indefinite"
      />

    </rect>

  </g>


  <!-- ====================================================== -->
  <!-- HEADER                                                 -->
  <!-- ====================================================== -->

  <text
    x="36"
    y="47"
    class="mono"
    font-size="12"
    font-weight="700"
    letter-spacing="1.3"
    fill="#67E8F9"
  >
    DEVELOPER CONSOLE
  </text>


  <text
    x="36"
    y="66"
    class="sans"
    font-size="10.5"
    fill="#64748B"
  >
    Current engineering focus
  </text>


  <!-- ACTIVE STATUS -->

  <rect
    x="647"
    y="29"
    width="73"
    height="27"
    rx="13.5"
    fill="#22C55E"
    fill-opacity=".07"
    stroke="#22C55E"
    stroke-opacity=".28"
  />


  <circle
    class="active-dot"
    cx="663"
    cy="42.5"
    r="4"
    fill="#22C55E"
  />


  <text
    x="674"
    y="46"
    class="mono"
    font-size="9.5"
    font-weight="700"
    fill="#A7F3D0"
  >
    ACTIVE
  </text>


  <!-- HEADER DIVIDER -->

  <line
    x1="36"
    y1="77"
    x2="724"
    y2="77"
    stroke="#FFFFFF"
    stroke-opacity=".07"
  />


  <!-- ====================================================== -->
  <!-- CURRENT PROJECT ROW 1                                  -->
  <!-- ====================================================== -->


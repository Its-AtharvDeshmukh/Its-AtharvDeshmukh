    HEALTHORBIT
  </text>


  <text
    x="169"
    y="104"
    class="sans"
    font-size="12.5"
    fill="#D8E3EF"
  >
    wearable sync · OCR · timeline · trends · AI context
  </text>


  <!-- ====================================================== -->
  <!-- CURRENT PROJECT ROW 2                                  -->
  <!-- ====================================================== -->

  <rect

  >
    →
  </text>


  <!-- TEST -->

  <rect
    x="255"
    y="216"
    width="110"
    height="17"
    rx="8.5"
    fill="#3B82F6"
    fill-opacity=".09"
  />

  <text
    x="310"
    y="228"
    text-anchor="middle"
    class="mono"
    font-size="8.8"
    font-weight="700"
    fill="#93C5FD"

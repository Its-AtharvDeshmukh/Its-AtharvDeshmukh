<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 300"
  width="760"
  height="300"
  role="img"
  aria-labelledby="title description"
>

  <title id="title">Atharv Deshmukh — Experience and Recognition</title>

  <desc id="description">
    Hackathon 2026 experience, Oasis Infobyte internship,
    technical certifications, and current engineering focus.
  </desc>


  <defs>

    <!-- ================================================== -->
    <!-- BACKGROUND                                         -->
    <!-- ================================================== -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1626"/>
      <stop offset="52%" stop-color="#08121F"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- OUTER BORDER                                       -->
    <!-- ================================================== -->

    <linearGradient id="outerBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity=".60"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity=".55"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- CARD BACKGROUND                                    -->
    <!-- ================================================== -->

    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".055"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".018"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- CARD ACCENTS                                       -->
    <!-- ================================================== -->

    <linearGradient id="hackAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="internAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="certAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- GLOWS                                              -->
    <!-- ================================================== -->

    <radialGradient id="cyanGlow" cx="0%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow" cx="100%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>


    <!-- ================================================== -->
    <!-- REFLECTION                                         -->
    <!-- ================================================== -->

    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="44%" stop-color="#FFFFFF" stop-opacity=".012"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".09"/>
      <stop offset="56%" stop-color="#FFFFFF" stop-opacity=".018"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- CLIP                                               -->
    <!-- ================================================== -->

    <clipPath id="mainClip">
      <rect
        x="8"
        y="8"
        width="744"
        height="284"
        rx="24"
      />
    </clipPath>


    <!-- ================================================== -->
    <!-- STYLES                                             -->
    <!-- ================================================== -->

    <style>

      .sans {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "JetBrains Mono",
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
      }


      .reflection {
        animation:
          reflectionSweep
          8s
          cubic-bezier(.4,0,.2,1)
          infinite;
      }

      @keyframes reflectionSweep {

        0% {
          transform: translateX(-170px);
          opacity: 0;
        }

        15% {
          opacity: .7;
        }

        72% {
          opacity: .7;
        }

        86% {
          opacity: 0;
        }

        100% {
          transform: translateX(960px);
          opacity: 0;
        }

      }


      .pulse-1 {
        animation: pulse 2.7s ease-in-out infinite;
      }

      .pulse-2 {
        animation: pulse 2.7s .8s ease-in-out infinite;
      }

      .pulse-3 {
        animation: pulse 2.7s 1.6s ease-in-out infinite;
      }

      @keyframes pulse {

        0%,
        100% {
          opacity: .48;
        }

        50% {
          opacity: 1;
        }

      }


      .accent {
        animation:
          accentPulse
          4s
          ease-in-out
          infinite;
      }

      @keyframes accentPulse {

        0%,
        100% {
          opacity: .60;
        }

        50% {
          opacity: 1;
        }

      }


      @media (prefers-reduced-motion: reduce) {

        * {
          animation: none !important;
        }

      }

    </style>

  </defs>



  </text>


  <!-- PROFILE STATUS -->

  <rect
    x="615"
    y="29"
    width="109"
    height="27"
    rx="13.5"
    fill="#22C55E"
    fill-opacity=".07"
    stroke="#22C55E"
    stroke-opacity=".25"
  />


  <circle
    class="status-dot"
    cx="631"
    cy="42.5"
    r="3.7"
    fill="#22C55E"
  />


  <text
    x="642"
    y="46"
    class="mono"
    font-size="9"
    font-weight="700"

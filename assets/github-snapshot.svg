    Java · DSA · Systems
  </text>


  <!-- ====================================================== -->
  <!-- BOTTOM LINK SIGNAL                                     -->
  <!-- ====================================================== -->

  <line
    class="flow-line"
    x1="275"
    y1="227"
    x2="485"
    y2="227"
    stroke="url(#accent)"
    stroke-width="1.2"
    stroke-opacity=".58"
  />


  <circle

<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 250"
  width="760"
  height="250"
  role="img"
  aria-labelledby="title description"
>

  <title id="title">Atharv Deshmukh — GitHub Snapshot</title>

  <desc id="description">
    GitHub profile snapshot showing Atharv Deshmukh's flagship repositories,
    engineering areas, development practice, and GitHub profile.
  </desc>


  <defs>

    <!-- ================================================== -->
    <!-- BACKGROUND                                         -->
    <!-- ================================================== -->

    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="50%" stop-color="#0A1627"/>
      <stop offset="100%" stop-color="#060B13"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- MAIN BORDER                                        -->
    <!-- ================================================== -->

    <linearGradient
      id="mainBorder"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".65"/>
      <stop offset="36%" stop-color="#0891B2" stop-opacity=".72"/>
      <stop offset="66%" stop-color="#8B5CF6" stop-opacity=".78"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity=".60"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- TOP ACCENT                                         -->
    <!-- ================================================== -->

    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="34%" stop-color="#06B6D4"/>
      <stop offset="66%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- GLOWS                                              -->
    <!-- ================================================== -->

    <radialGradient
      id="cyanGlow"
      cx="88%"
      cy="5%"
      r="58%"
    >
      <stop
        offset="0%"
        stop-color="#22D3EE"
        stop-opacity=".16"
      />

      <stop
        offset="100%"
        stop-color="#22D3EE"
        stop-opacity="0"
      />
    </radialGradient>


    <radialGradient
      id="violetGlow"
      cx="8%"
      cy="100%"
      r="62%"
    >
      <stop
        offset="0%"
        stop-color="#8B5CF6"
        stop-opacity=".15"
      />

      <stop
        offset="100%"
        stop-color="#8B5CF6"
        stop-opacity="0"
      />
    </radialGradient>


    <!-- ================================================== -->
    <!-- PANEL BACKGROUND                                   -->
    <!-- ================================================== -->

    <linearGradient
      id="panelBackground"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#FFFFFF"
        stop-opacity=".045"
      />

      <stop
        offset="100%"
        stop-color="#FFFFFF"
        stop-opacity=".018"
      />
    </linearGradient>


    <!-- ================================================== -->
    <!-- REFLECTION                                         -->
    <!-- ================================================== -->

    <linearGradient
      id="reflection"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />

      <stop
        offset="38%"
        stop-color="#FFFFFF"
        stop-opacity=".018"
      />

      <stop
        offset="50%"
        stop-color="#FFFFFF"
        stop-opacity=".14"
      />

      <stop
        offset="62%"
        stop-color="#FFFFFF"
        stop-opacity=".025"
      />

      <stop
        offset="100%"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />
    </linearGradient>


    <!-- ================================================== -->
    <!-- CLIPPING                                           -->
    <!-- ================================================== -->

    <clipPath id="cardClip">
      <rect
        x="10"
        y="10"
        width="740"
        height="230"
        rx="24"
      />
    </clipPath>


    <!-- ================================================== -->
    <!-- SOFT BLUR                                          -->
    <!-- ================================================== -->

    <filter
      id="softBlur"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur stdDeviation="22"/>
    </filter>


    <!-- ================================================== -->
    <!-- TEXT / ANIMATION                                   -->
    <!-- ================================================== -->

    <style>

      .sans {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "JetBrains Mono",
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
      }


      .status-dot {
        animation:
          statusPulse
          2.4s
          ease-in-out
          infinite;
      }

      @keyframes statusPulse {

        0%,
        100% {
          opacity: .45;
        }

        50% {
          opacity: 1;
        }

      }


      .repo-dot-1 {
        animation:
          repoPulse
          3s
          ease-in-out
          infinite;
      }

      .repo-dot-2 {
        animation:
          repoPulse
          3s
          .35s
          ease-in-out
          infinite;
      }

      .repo-dot-3 {
        animation:
          repoPulse
          3s
          .7s
          ease-in-out
          infinite;
      }

      @keyframes repoPulse {

        0%,
        100% {
          opacity: .50;
        }

        50% {
          opacity: 1;
        }

      }


      .flow-line {
        stroke-dasharray: 3 7;

        animation:
          lineFlow
          2.1s
          linear
          infinite;
      }

      @keyframes lineFlow {

        to {
          stroke-dashoffset: -20;
        }

      }


      .reflection {
        animation:
          reflectionSweep
          7.5s
          cubic-bezier(.4,0,.2,1)
          infinite;
      }

      @keyframes reflectionSweep {

        0% {
          transform: translateX(-180px);
          opacity: 0;
        }

        12% {
          opacity: .90;
        }

        72% {
          opacity: .90;
        }

        86% {
          opacity: 0;
        }

        100% {
          transform: translateX(1000px);
          opacity: 0;
        }

      }


      @media (prefers-reduced-motion: reduce) {

        .status-dot,
        .repo-dot-1,
        .repo-dot-2,
        .repo-dot-3,
        .flow-line,
        .reflection {
          animation: none !important;
        }

      }

    </style>

  </defs>


  <!-- ====================================================== -->
  <!-- MAIN CARD                                              -->
  <!-- ====================================================== -->

  <rect
    x="10"
    y="10"
    width="740"
    height="230"
    rx="24"
    fill="url(#background)"
    stroke="url(#mainBorder)"
    stroke-width="1.35"
  />


  <!-- BACKGROUND COLOR DEPTH -->

  <rect
    x="10"
    y="10"
    width="740"
    height="230"
    rx="24"
    fill="url(#cyanGlow)"
  />


  <rect
    x="10"
    y="10"
    width="740"
    height="230"
    rx="24"
    fill="url(#violetGlow)"
  />


  <!-- DECORATIVE GLOWS -->

  <g clip-path="url(#cardClip)">

    <circle
      cx="690"
      cy="30"
      r="78"
      fill="#22D3EE"
      fill-opacity=".07"
      filter="url(#softBlur)"
    />


    <circle
      cx="55"
      cy="235"
      r="90"
      fill="#8B5CF6"
      fill-opacity=".08"
      filter="url(#softBlur)"
    />

  </g>


  <!-- ====================================================== -->
  <!-- MOVING GLASS REFLECTION                                -->
  <!-- ====================================================== -->

  <g clip-path="url(#cardClip)">

    <g class="reflection">

      <g transform="rotate(14 -70 120)">

        <rect
          x="-130"
          y="-100"
          width="100"
          height="440"
          rx="30"
          fill="url(#reflection)"
        />

      </g>

    </g>

  </g>


  <!-- ====================================================== -->
  <!-- HEADER                                                 -->
  <!-- ====================================================== -->

  <rect
    x="10"
    y="10"
    width="740"
    height="3"
    rx="1.5"
    fill="url(#accent)"
    opacity=".92"
  />


  <text
    x="34"
    y="43"
    class="mono"
    font-size="12"
    font-weight="700"
    letter-spacing="1.3"
    fill="#67E8F9"
  >

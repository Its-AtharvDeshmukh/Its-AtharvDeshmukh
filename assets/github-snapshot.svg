  </text>


  <!-- HEADER DIVIDER -->

  <line
    x1="34"
    y1="73"
    x2="726"
    y2="73"
    stroke="#FFFFFF"
    stroke-opacity=".07"
  />


  <!-- ====================================================== -->
  <!-- LEFT PANEL                                             -->
  <!-- ====================================================== -->

  <rect
    x="34"
